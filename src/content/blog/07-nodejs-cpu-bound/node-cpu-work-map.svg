<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 452' width='760' height='452' font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><rect width='760' height='452' fill='#ffffff'/><defs><marker id='m' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#c3c2b7'/></marker></defs><text x='24' y='32' font-size='15' font-weight="700" fill='#141413' text-anchor='start'>CPU를 쓰는 주체에 따라 방법이 갈린다</text><g fill='none' stroke='#c3c2b7' stroke-width='1.25'><path d='M380 108V132H200V156' marker-end='url(#m)'/><path d='M380 132H560V156' marker-end='url(#m)'/><path d='M200 212V237H119V262' marker-end='url(#m)'/><path d='M200 237H327V262' marker-end='url(#m)'/><path d='M560 212V237H580V262' marker-end='url(#m)'/><path d='M119 318V345H580V318'/><path d='M327 318V345'/><path d='M380 345V372' marker-end='url(#m)'/></g><rect x='240' y='60' width='280' height='48' rx='8' fill='none' stroke='#c3c2b7' stroke-width='1.25'/><text x='380' y='88' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>CPU를 많이 쓰는 작업이 생겼다</text><rect x='60' y='156' width='280' height='56' rx='8' fill='none' stroke='#c3c2b7' stroke-width='1.25'/><text x='200' y='180' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>JS 코드로 직접 계산</text><text x='200' y='200' font-size='11.5' fill='#5e5d59' text-anchor='middle'>실행하는 동안 이벤트 루프가 막힌다</text><rect x='420' y='156' width='280' height='56' rx='8' fill='none' stroke='#c3c2b7' stroke-width='1.25'/><text x='560' y='180' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>외부 프로그램을 실행</text><text x='560' y='200' font-size='11.5' fill='#5e5d59' text-anchor='middle'>Node는 결과를 기다리기만 한다</text><rect x='24' y='262' width='190' height='56' rx='8' fill='none' stroke='#c3c2b7' stroke-width='1.25'/><text x='119' y='286' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>가벼우면 쪼개기</text><text x='119' y='306' font-size='11.5' fill='#5e5d59' text-anchor='middle'>setImmediate로 차례 양보</text><rect x='232' y='262' width='190' height='56' rx='8' fill='none' stroke='#c3c2b7' stroke-width='1.25'/><text x='327' y='286' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>무거우면 워커 스레드 풀</text><text x='327' y='306' font-size='11.5' fill='#5e5d59' text-anchor='middle'>worker_threads, 코어 수만큼</text><rect x='440' y='262' width='280' height='56' rx='8' fill='#2b6fd6' fill-opacity='0.12' stroke='#2b6fd6' stroke-width='2'/><text x='580' y='286' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>비동기 실행 + 동시 실행 상한</text><text x='580' y='306' font-size='11.5' fill='#5e5d59' text-anchor='middle'>exec + p-limit, 컴파일 서버의 답</text><text x='390' y='364' font-size='11.5' fill='#5e5d59' text-anchor='start'>규모가 커지면</text><rect x='180' y='372' width='400' height='56' rx='8' fill='none' stroke='#c3c2b7' stroke-width='1.25'/><text x='380' y='396' font-size='13' font-weight="700" fill='#141413' text-anchor='middle'>작업 큐 + 별도 워커 서버</text><text x='380' y='416' font-size='11.5' fill='#5e5d59' text-anchor='middle'>BullMQ, SQS 등으로 서버 밖에서 처리</text></svg>
